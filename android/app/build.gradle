apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

/**
 * This is the configuration block to customize your React Native Android app.
 * By default you don't need to apply any configuration, just uncomment the lines you need.
 */
react {
    /* Folders */
    //   The root of your project, i.e. where "package.json" lives. Default is '../..'
    // root = file("../../")
    //   The folder where the react-native NPM package is. Default is ../../node_modules/react-native
    // reactNativeDir = file("../../node_modules/react-native")
    //   The folder where the react-native Codegen package is. Default is ../../node_modules/@react-native/codegen
    // codegenDir = file("../../node_modules/@react-native/codegen")
    //   The cli.js file which is the React Native CLI entrypoint. Default is ../../node_modules/react-native/cli.js
    // cliFile = file("../../node_modules/react-native/cli.js")

    /* Variants */
    //   The list of variants to that are debuggable. For those we're going to
    //   skip the bundling of the JS bundle and the assets. Default is "debug", "debugOptimized".
    //   If you add flavors like lite, prod, etc. you'll have to list your debuggableVariants.
    // debuggableVariants = ["liteDebug", "liteDebugOptimized", "prodDebug", "prodDebugOptimized"]

    /* Bundling */
    //   A list containing the node command and its flags. Default is just 'node'.
    // nodeExecutableAndArgs = ["node"]
    //
    //   The command to run when bundling. By default is 'bundle'
    // bundleCommand = "ram-bundle"
    //
    //   The path to the CLI configuration file. Default is empty.
    // bundleConfig = file(../rn-cli.config.js)
    //
    //   The name of the generated asset file containing your JS bundle
    // bundleAssetName = "MyApplication.android.bundle"
    //
    //   The entry file for bundle generation. Default is 'index.android.js' or 'index.js'
    // entryFile = file("../js/MyApplication.android.js")
    //
    //   A list of extra flags to pass to the 'bundle' commands.
    //   See https://github.com/react-native-community/cli/blob/main/docs/commands.md#bundle
    // extraPackagerArgs = []

    /* Hermes Commands */
    //   The hermes compiler command to run. By default it is 'hermesc'
    // hermesCommand = "$rootDir/my-custom-hermesc/bin/hermesc"
    //
    //   The list of flags to pass to the Hermes compiler. By default is "-O", "-output-source-map"
    // hermesFlags = ["-O", "-output-source-map"]

    /* Autolinking */
    autolinkLibrariesWithApp()
}

/**
 * Set this to true to Run Proguard on Release builds to minify the Java bytecode.
 */
// R8 shrinks unused Java/Kotlin code and resources (smaller APK). Keep rules: proguard-rules.pro.
// Test the release APK on a real phone after this change.
def enableProguardInReleaseBuilds = true

// Release key: your own private key, never the public debug key (Play Protect blocks APKs signed
// with the shared debug key). Nothing secret lives in the repo in plain form: CI decrypts
// android/app/release-bundle.tgz.enc (AES-256, passphrase = RELEASE_BUNDLE_PASSPHRASE secret) into a
// temp dir outside the repo and passes the keystore path + passwords as env vars:
//   RELEASE_KEYSTORE_FILE, RELEASE_KEYSTORE_PASSWORD, RELEASE_KEY_ALIAS, RELEASE_KEY_PASSWORD
// Without them (local builds) the release build falls back to the debug key.
def envOr = { String name, String fallback -> def v = System.getenv(name); v ? v : fallback }
def releaseStoreFile = System.getenv("RELEASE_KEYSTORE_FILE")
def releaseStorePassword = System.getenv("RELEASE_KEYSTORE_PASSWORD")
def releaseKeyPassword = envOr("RELEASE_KEY_PASSWORD", releaseStorePassword)
def releaseKeyAlias = envOr("RELEASE_KEY_ALIAS", "outfit")
def hasReleaseKey = releaseStoreFile && releaseStorePassword && file(releaseStoreFile).exists()

// GITHUB_RUN_NUMBER of the Android CI run (main.yml), which is also the build-N release tag
def ciBuildNumber = (System.getenv("GITHUB_RUN_NUMBER") ?: "1").toInteger()

/**
 * The preferred build flavor of JavaScriptCore (JSC)
 *
 * For example, to use the international variant, you can use:
 * `def jscFlavor = io.github.react-native-community:jsc-android-intl:2026004.+`
 *
 * The international variant includes ICU i18n library and necessary data
 * allowing to use e.g. `Date.toLocaleString` and `String.localeCompare` that
 * give correct results when using with locales other than en-US. Note that
 * this variant is about 6MiB larger per architecture than default.
 */
def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'

// Firebase Cloud Messaging (push) without the google-services Gradle plugin: the same string
// resources that plugin would generate (google_app_id, gcm_defaultSenderId, ...), read from
// google-services.json for this applicationId. FirebaseInitProvider then starts Firebase by itself.
def gsFile = file("google-services.json")
def gsClient = null
def gsProject = null
if (gsFile.exists()) {
    def gs = new groovy.json.JsonSlurper().parse(gsFile)
    gsProject = gs.project_info
    gsClient = gs.client.find { it.client_info.android_client_info.package_name == "com.saibabu.outfit" }
}

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "com.outfit"
    defaultConfig {
        applicationId "com.saibabu.outfit"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // CI build number (build-N release): every APK has a higher versionCode, so a new
        // download installs over the old one. Local builds: 1.
        versionCode ciBuildNumber
        versionName "1.0.${ciBuildNumber}"
        if (gsClient != null) {
            resValue "string", "google_app_id", gsClient.client_info.mobilesdk_app_id
            resValue "string", "gcm_defaultSenderId", gsProject.project_number
            resValue "string", "project_id", gsProject.project_id
            resValue "string", "google_api_key", gsClient.api_key[0].current_key
            resValue "string", "google_crash_reporting_api_key", gsClient.api_key[0].current_key
            if (gsProject.storage_bucket) resValue "string", "google_storage_bucket", gsProject.storage_bucket
        }
    }
    buildFeatures {
        resValues true
    }

    // One APK only: arm64-v8a (every 64-bit phone; 32-bit/x86 dropped to keep it small).
    // Output: app-release.apk, published as Outfit.apk.
    signingConfigs {
        if (hasReleaseKey) {
            release {
                storeFile file(releaseStoreFile)
                storeType "pkcs12"
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            // Own release key when present; the debug key only for local test builds
            signingConfig hasReleaseKey ? signingConfigs.release : signingConfigs.debug
            minifyEnabled enableProguardInReleaseBuilds
            shrinkResources enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }
}

dependencies {
    // The version of react-native is set by the React Native Gradle Plugin
    implementation("com.facebook.react:react-android")
    // Phone Number Hint (SIM number picker) + fingerprint app lock
    implementation("com.google.android.gms:play-services-auth:21.4.0")
    implementation("androidx.biometric:biometric:1.1.0")
    // Push notifications (FCM): token + OutfitMessagingService; Firebase starts from the resValues above
    implementation(platform("com.google.firebase:firebase-bom:33.7.0"))
    implementation("com.google.firebase:firebase-messaging")
    // Offline translation of other users' posts / comments / chat (on-device ML Kit, free, no server)
    implementation("com.google.mlkit:translate:17.0.3")
    implementation("com.google.mlkit:language-id:17.0.6")
    // Clothing photo background (plain white/black or blur), on-device subject segmentation via Play services
    implementation("com.google.android.gms:play-services-mlkit-subject-segmentation:16.0.0-beta1")
    // Wardrobe auto tags (WardrobeVisionModule.kt): Play services Image Labeling, model downloaded by
    // Play services, so no MBs are added to the APK. Called lazily and guarded.
    implementation("com.google.android.gms:play-services-mlkit-image-labeling:16.0.8")
    // "Blur face" photo option: on-device face detection, bundled model (works offline, free, no upload)
    implementation("com.google.mlkit:face-detection:16.1.7")
    // JVM unit tests for pure Kotlin maths (src/test, e.g. SegmentMathTest): ./gradlew :app:testDebugUnitTest
    testImplementation("junit:junit:4.13.2")

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}
