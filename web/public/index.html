<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>OUTFIT</title>
  <meta name="description" content="OUTFIT: AI personal stylist and daily colour guide" />
  <meta name="theme-color" content="#2D1F6E" />
  <link rel="manifest" href="<%= publicPath %>manifest.json" />
  <link rel="icon" type="image/png" sizes="32x32" href="<%= publicPath %>icons/favicon-32.png" />
  <link rel="apple-touch-icon" href="<%= publicPath %>icons/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="OUTFIT" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <script>
    // Invite links (/?ref=CODE) opened in an Android browser go to the app download page.
    // Never on iPhone / iPad / computers, and not when /get/ sent them here on purpose (web=1).
    (function () {
      try {
        if (/[?&]ref=[^&#]+/i.test(location.search) && !/[?&]web=1/.test(location.search)
            && /Android/i.test(navigator.userAgent || '')) {
          location.replace('<%= publicPath %>get/' + location.search);
        }
      } catch (e) {}
    })();
  </script>
  <style>
    html, body, #root { height: 100%; margin: 0; }
    body { background: #F5F4FA; overscroll-behavior-y: none; }
    @media (prefers-color-scheme: dark) { body { background: #0F0D17; } }
    #root { display: flex; flex-direction: column; }
    /* Phone-width column on big screens */
    @media (min-width: 700px) {
      #root { max-width: 520px; margin: 0 auto; box-shadow: 0 0 24px rgba(0,0,0,.08); }
    }
  </style>
</head>
<body>
  <noscript>OUTFIT needs JavaScript to run.</noscript>
  <div id="root"></div>
</body>
</html>
