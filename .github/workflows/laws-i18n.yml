name: Laws plain-language text (EN / TE / HI, Gemini)

# Generates src/data/laws/plain.en.ts / plain.te.ts / plain.hi.ts (plain title + simple explanation
# for every Laws-tab section) with scripts/laws-i18n.js and commits them to the branch it ran on.
# Uses the repo secret GEMINI_API_KEY (never written to git). Resumable: only missing sections are
# generated, so running it again fills gaps.
# Runs by hand (Actions tab, workflow_dispatch) or when scripts/laws-i18n.request changes on the
# govt-laws-tabs branch (bump that file to re-run).
on:
  workflow_dispatch:
  push:
    branches: [govt-laws-tabs]
    paths:
      - scripts/laws-i18n.request

permissions:
  contents: write

concurrency:
  group: laws-i18n-${{ github.ref }}
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: TypeScript only (to read the law data)
        run: npm install --no-save --no-package-lock --ignore-scripts typescript@6

      - name: Generate plain-language text
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then echo "::error::GEMINI_API_KEY repo secret not set"; exit 1; fi
          timeout 65m node scripts/laws-i18n.js --batch 12 || echo "::warning::generator stopped early; partial progress is kept"

      - name: Commit generated files
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/laws/plain.en.ts src/data/laws/plain.te.ts src/data/laws/plain.hi.ts
          if git diff --cached --quiet; then echo "nothing new"; exit 0; fi
          git commit -m "Laws: plain-language EN/TE/HI text (generated by laws-i18n workflow)"
          git pull --rebase origin "${{ github.ref_name }}"
          git push origin "HEAD:${{ github.ref_name }}"
