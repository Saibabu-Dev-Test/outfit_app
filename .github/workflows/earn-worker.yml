name: Deploy earn worker (Cloudflare, free)
# Needs repo secrets: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID, FIREBASE_SA_JSON, BITLABS_SECRET.
on:
  push:
    branches: [main]
    paths: ['server/worker/**', '.github/workflows/earn-worker.yml']
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check secrets
        id: s
        env:
          T: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: if [ -z "$T" ]; then echo "::warning::CLOUDFLARE_API_TOKEN not set, skipping"; echo ok=0 >> $GITHUB_OUTPUT; else echo ok=1 >> $GITHUB_OUTPUT; fi
      - name: Deploy + secrets
        if: steps.s.outputs.ok == '1'
        working-directory: server/worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          FIREBASE_SA_JSON: ${{ secrets.FIREBASE_SA_JSON }}
          BITLABS_SECRET: ${{ secrets.BITLABS_SECRET }}
        run: |
          npx -y wrangler@3 deploy
          printf '%s' "$FIREBASE_SA_JSON" | npx -y wrangler@3 secret put FIREBASE_SA_JSON
          printf '%s' "$BITLABS_SECRET" | npx -y wrangler@3 secret put BITLABS_SECRET
