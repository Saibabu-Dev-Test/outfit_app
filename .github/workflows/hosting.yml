name: Deploy Firebase Hosting (/get/ + /privacy/)

# Publishes hosting-public/ (built by scripts/build-hosting.js: the /get/ download page, icons,
# /privacy/ policy for the app store listing) to https://outfit-vote-9edca.web.app when those
# sources change on main, or by hand from the Actions tab.
# Auth: same keyless Workload Identity Federation as firestore.yml (github-deployer has
# roles/firebasehosting.admin), else the optional FIREBASE_SERVICE_ACCOUNT secret.
on:
  push:
    branches: [main]
    paths:
      - web/public/get/**
      - web/public/icons/**
      - web/public/privacy/**
      - hosting-public/**
      - scripts/build-hosting.js
      - src/config/links.ts
      - firebase.json
      - .github/workflows/hosting.yml
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Firebase project
        id: cfg
        run: |
          PROJECT=$(node -e "try{console.log(require('./.firebaserc').projects.default||'')}catch(e){console.log('')}")
          if [ -z "$PROJECT" ]; then
            PROJECT=$(node -e "console.log(require('./android/app/google-services.json').project_info.project_id)")
          fi
          echo "project=$PROJECT" >> "$GITHUB_OUTPUT"
          echo "Firebase project: $PROJECT"

      - name: Google auth (Workload Identity Federation)
        id: wif
        continue-on-error: true
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/791853722614/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: github-deployer@outfit-vote-9edca.iam.gserviceaccount.com
          create_credentials_file: true

      - name: Google auth (FIREBASE_SERVICE_ACCOUNT fallback)
        id: sa
        if: steps.wif.outcome != 'success'
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$SA" ]; then
            echo "::warning::Workload Identity auth failed and FIREBASE_SERVICE_ACCOUNT is not set: hosting was NOT deployed."
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          umask 077
          printf '%s' "$SA" > "$RUNNER_TEMP/sa.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/sa.json" >> "$GITHUB_ENV"
          echo "ready=true" >> "$GITHUB_OUTPUT"

      # firebase.json predeploy runs scripts/build-hosting.js (assembles hosting-public/)
      - name: Deploy hosting
        if: steps.wif.outcome == 'success' || steps.sa.outputs.ready == 'true'
        run: npx -y firebase-tools@13 deploy --only hosting --project "${{ steps.cfg.outputs.project }}" --non-interactive --force

      - name: Check /privacy/ is live
        if: steps.wif.outcome == 'success' || steps.sa.outputs.ready == 'true'
        run: |
          sleep 10
          curl -fsS -o /dev/null -w "privacy: %{http_code}\n" https://outfit-vote-9edca.web.app/privacy/
          curl -fsS -o /dev/null -w "get: %{http_code}\n" https://outfit-vote-9edca.web.app/get/

      - name: Remove key file
        if: always()
        run: rm -f "$RUNNER_TEMP/sa.json"
