name: React Native Android CI

on:
  push:
    branches:
      - main
  # Pull requests into main: same build + tests (APK kept as a workflow artifact), no release
  pull_request:
    branches:
      - main
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Get the latest source code
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # 3. Install Java/JDK
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          # Keeps the Gradle distribution + dependencies between runs
          cache: gradle

      # 4. Install JavaScript dependencies
      - name: Install dependencies
        run: npm install

      # 4.2. Unit tests (Jest) must pass before the APK is built
      - name: Run tests
        run: npx jest --ci

      # 4.5. AI stylist key from the GEMINI_API_KEY secret (empty when the secret is missing)
      - name: Write AI config
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          node -e "require('fs').writeFileSync('src/config/ai.generated.ts', '// Written by CI. Do not commit.\nexport const GEMINI_API_KEY: string = ' + JSON.stringify(process.env.GEMINI_API_KEY || '') + ';\n')"
          if [ -n "$GEMINI_API_KEY" ]; then echo "AI key: set"; else echo "AI key: missing (AI stylist shows coming soon)"; fi

      # 4.8. Gradle distribution with retries and mirrors (services.gradle.org sometimes returns 504)
      - name: Fetch Gradle distribution
        run: |
          PROPS=android/gradle/wrapper/gradle-wrapper.properties
          URL=$(grep '^distributionUrl=' "$PROPS" | cut -d= -f2- | sed 's#\\:#:#g')
          FILE=$(basename "$URL")
          VER=$(echo "$FILE" | sed -E 's/gradle-(.*)-bin\.zip/\1/')
          if ls ~/.gradle/wrapper/dists/gradle-$VER-bin/*/gradle-$VER/bin/gradle >/dev/null 2>&1; then
            echo "Gradle $VER already in cache"; exit 0
          fi
          DEST="$HOME/gradle-dl/$FILE"
          mkdir -p "$HOME/gradle-dl"
          for attempt in 1 2 3 4 5 6; do
            for u in "$URL" \
                     "https://mirrors.cloud.tencent.com/gradle/$FILE" \
                     "https://github.com/gradle/gradle-distributions/releases/download/v$VER/$FILE"; do
              echo "Try $attempt: $u"
              if curl -fsSL --connect-timeout 20 --max-time 300 -o "$DEST" "$u" && unzip -tq "$DEST" >/dev/null; then
                echo "Downloaded from $u"
                sed -i "s#^distributionUrl=.*#distributionUrl=file\\:$DEST#; s#^validateDistributionUrl=.*#validateDistributionUrl=false#" "$PROPS"
                grep '^distributionUrl=' "$PROPS"
                exit 0
              fi
            done
            sleep 30
          done
          echo "Could not download Gradle $VER"; exit 1

      # 4.9. CI only: resolve Maven Central from mirrors first (all repository lists)
      # (repo.maven.apache.org redirects some Kotlin jars to GitHub downloads, which returned 504)
      - name: Maven mirror for Gradle
        run: |
          mkdir -p ~/.gradle/init.d
          cat > ~/.gradle/init.d/maven-mirror.gradle <<'GRADLE'
          // Central mirrors that serve jars directly (no GitHub redirect)
          def mirrors = ['https://maven.aliyun.com/repository/public/', 'https://mirrors.cloud.tencent.com/nexus/repository/maven-public/', 'https://repo1.maven.org/maven2/']
          def addFirst = { repos ->
            mirrors.reverse().eachWithIndex { u, i ->
              def m = repos.maven { url = u; name = "CentralMirror${i}" }
              repos.remove(m); repos.add(0, m)
            }
          }
          beforeSettings { s ->
            addFirst(s.pluginManagement.repositories)
            addFirst(s.dependencyResolutionManagement.repositories)
          }
          allprojects { p ->
            addFirst(p.buildscript.repositories)
            addFirst(p.repositories)
          }
          GRADLE
          cat ~/.gradle/init.d/maven-mirror.gradle

      # 5. Make Gradle executable
      - name: Make Gradlew executable
        run: chmod +x android/gradlew
        
      # 5.5. Generate and Display SHA-1 Fingerprint
      - name: Generate SHA-1 Fingerprint
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew signingReport | grep "SHA1" | head -n 1

      # 6. Build Android release APK (+ AAB), signed with the release key.
      # The key is android/app/release-bundle.tgz.enc: AES-256-CBC (PBKDF2, 200000 iterations) of a
      # tar holding outfit-release-v2.p12 + outfit-release-v2.env (KEYSTORE_PASSWORD, KEY_ALIAS,
      # KEY_PASSWORD). The passphrase is the RELEASE_BUNDLE_PASSPHRASE secret. It is decrypted into
      # a temp dir outside the repo, the values are masked, and build.gradle reads the RELEASE_* vars.
      - name: Build APK
        working-directory: android
        env:
          PASS: ${{ secrets.RELEASE_BUNDLE_PASSPHRASE }}
        # Retries: dependency downloads sometimes hit 504s; finished downloads stay cached between tries
        run: |
          set -euo pipefail
          if [ -z "${PASS:-}" ]; then
            echo "::error::RELEASE_BUNDLE_PASSPHRASE secret missing: cannot decrypt the release key. Without it the APK would be signed with the public debug key and Play Protect blocks it."
            exit 1
          fi
          umask 077
          KEYDIR="$RUNNER_TEMP/release-key"
          rm -rf "$KEYDIR"; mkdir -p "$KEYDIR"
          trap 'rm -rf "$KEYDIR"' EXIT
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -pass env:PASS \
            -in app/release-bundle.tgz.enc | tar -xz -C "$KEYDIR"
          unset PASS
          set -a; . "$KEYDIR/outfit-release-v2.env"; set +a
          echo "::add-mask::$KEYSTORE_PASSWORD"
          echo "::add-mask::$KEY_ALIAS"
          echo "::add-mask::$KEY_PASSWORD"
          export RELEASE_KEYSTORE_FILE="$KEYDIR/outfit-release-v2.p12"
          export RELEASE_KEYSTORE_PASSWORD="$KEYSTORE_PASSWORD"
          export RELEASE_KEY_ALIAS="$KEY_ALIAS"
          export RELEASE_KEY_PASSWORD="$KEY_PASSWORD"
          unset KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD
          echo "Release key: decrypted from release-bundle.tgz.enc"
          built=0
          for attempt in 1 2 3; do
            if ./gradlew assembleRelease; then built=1; break; fi
            echo "Build attempt $attempt failed; retrying in 60 s"
            sleep 60
          done
          [ "$built" = 1 ] || exit 1
          # Play Store bundle (optional: a failure here does not fail the APK release)
          # Store bundle with 32-bit + 64-bit (PhonePe Appstore requires both; each phone still
          # downloads only its own ABI). The sideload APK above stays arm64-only (small).
          ./gradlew bundleRelease -PreactNativeArchitectures=armeabi-v7a,arm64-v8a || echo "::warning::bundleRelease failed; release has the APK only"

      - name: Remove decoded key
        if: always()
        run: rm -rf "$RUNNER_TEMP/release-key"
      # 6.5. One APK only (arm64-v8a) -> Outfit.apk
      - name: Collect APK
        run: |
          OUT=android/app/build/outputs/apk/release
          ls -la "$OUT"
          mkdir -p apks
          if [ ! -f "$OUT/app-release.apk" ]; then echo "Missing app-release.apk"; exit 1; fi
          cp "$OUT/app-release.apk" apks/Outfit.apk
          AAB=android/app/build/outputs/bundle/release/app-release.aab
          if [ -f "$AAB" ]; then cp "$AAB" apks/Outfit.aab; fi
          ls -la apks

      # 6.8. The APK must be signed with the release key (not the debug or the old key)
      - name: Verify APK signer
        env:
          EXPECTED_CERT_SHA256: E4:59:0A:B6:71:C4:6D:C8:7E:F3:32:88:E0:6C:3B:55:7D:A3:5F:83:B3:42:3B:FF:D9:65:12:DC:21:88:E8:E2
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n 1)
          "$APKSIGNER" verify --print-certs apks/Outfit.apk | tee signer.txt
          GOT=$(grep -m1 'certificate SHA-256 digest' signer.txt | awk '{print $NF}' | tr -d ' ' | tr 'a-f' 'A-F' | sed 's/../&:/g; s/:$//')
          echo "Signer SHA-256: $GOT"
          if [ "$GOT" != "$EXPECTED_CERT_SHA256" ]; then echo "::error::APK signer $GOT is not the release key $EXPECTED_CERT_SHA256"; exit 1; fi

      # 7. Upload generated APKs
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Outfit-apk
          path: apks/Outfit.apk
          retention-days: 3

      # 8. Create GitHub Release. Only for pushes to main: pull-request builds are checks (artifact only).
      # HOLD: builds signed with the NEW key (cert SHA-256 E4:59:0A:B6:...:E8:E2) are published as
      # PRE-RELEASES, not latest, so the /get/ page and the in-app update (both use releases/latest)
      # keep serving the last old-key build until the new SHA-1/SHA-256 are added to Firebase
      # (Google Sign-In). After that, set prerelease: false and make_latest: true again.
      - name: Create GitHub Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Outfit build ${{ github.run_number }}
          prerelease: true
          make_latest: false
          files: |
            apks/Outfit.apk
            apks/Outfit.aab
