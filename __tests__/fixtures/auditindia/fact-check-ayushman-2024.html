<html><head><title>Ayushman for Senior Citizens: We will expand the Ayushman Bharat Yojana to cover Senior Citizens and provide them access to free and quality healthcare. — Audit India</title><meta name="description" content="The expansion is under way and its deadline has not arrived, so no verdict on delivery is possible yet. What can be recorded is the state of the scheme being expanded. The CAG&#x27;s performance audit of PM-JAY, tabled in August 2023, found 7.87 crore of a targeted 10.74 crore households registered, the registration system&#x27;s match confidence score not applied at all, 4,761 registrations against seven Aadhaar numbers in Tamil Nadu, and 2,14,923 claims shown as paid for fresh treatment of patients already recorded dead — of which 3,903, worth ₹6.97 crore, were actually paid. The audit is equally clear that the scheme has had a strong positive impact on the economically weaker sections."/></head><body><main><div lang="en"><p class="figure text-label uppercase tracking-[0.12em] text-faint">Delivery</p><p class="mt-1 flex items-center gap-2 text-lg font-bold text-unverifiable"><span aria-hidden="true">◌</span>Too early to assess</p></div><p class="figure flex flex-wrap gap-x-5 gap-y-1 text-meta text-faint"><span>promised 14 Apr 2024</span><span>checked 24 Aug 2026</span><span>data as of 14 Apr 2024</span><span>2 sources</span><span>CAG audit: predates the claim</span></p><script type="application/ld+json">{"@context":"https://schema.org","@type":"ClaimReview","url":"https://auditindia.org/en/fact-checks/promise-2024-ayushman-bharat-extend-free-5-lakh-health-cover-to-all-citiz/","inLanguage":"en","datePublished":"2026-08-24","dateModified":"2026-08-24","author":{"@type":"Organization","name":"Audit India","url":"https://auditindia.org"},"claimReviewed":"Ayushman for Senior Citizens: We will expand the Ayushman Bharat Yojana to cover Senior Citizens and provide them access to free and quality healthcare.","itemReviewed":{"@type":"Claim","author"
