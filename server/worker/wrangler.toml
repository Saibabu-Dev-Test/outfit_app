# Cloudflare Worker 'outfit-api' (free plan) + D1 database 'outfit-db' (free: 5M rows read/day,
# 100k rows written/day, 5 GB). Only free features: one module worker on workers.dev, one D1
# database, one daily cron trigger. Deployed by .github/workflows/deploy-earn-worker.yml or by hand:
#   cd server/worker && npx wrangler d1 migrations apply outfit-db --remote && npx wrangler deploy
# Secrets (wrangler secret put NAME, never written here; missing = that handler answers 503):
#   BITLABS_SECRET        BitLabs dashboard > App > Integration > Secret Key
#   CPX_SECURE_HASH       CPX Research dashboard > App > Secure hash
#   OFFERWALL_GG_SECRET   Offerwall.GG placement > Integration > Secret key
#   FIREBASE_SA_JSON      optional: Google service account JSON (Firestore mirror of earn credits)
#   BITLABS_CALLBACK_BASE optional: exact https://host BitLabs calls, to pin scheme + host
name = "outfit-api"
main = "src/index.js"
compatibility_date = "2026-11-01"
workers_dev = true

[vars]
FIREBASE_PROJECT_ID = "outfit-vote-9edca"

[[d1_databases]]
binding = "DB"
database_name = "outfit-db"
database_id = "3b5f3c2f-26a2-429e-8f5b-8d90c8123b3c"
migrations_dir = "migrations"

[triggers]
crons = ["30 0 * * *"]
